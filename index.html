<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <!-- No theme-color, matching map-downloader: iOS Safari then keeps its frosted-glass chrome over the map. -->
    <link rel="stylesheet" href="/src/style.css" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta
      name="description"
      content="View MBTiles and Styled Map Package (.smp) files in your browser, offline."
    />
    <title>Map Viewer</title>
  </head>
  <body>
    <div id="app">
      <div id="map" class="map-host hidden"></div>

      <header class="va-brand">
        <img class="va-brand-mark" src="/logo.svg" alt="" />
        Map Viewer
      </header>

      <main class="mv-landing">
        <section class="mv-card">
          <h1 class="mv-title">Open a map</h1>
          <p class="mv-sub">
            View MBTiles and Styled Map Package files. Your file stays on this
            device, and the viewer works offline.
          </p>

          <input
            id="file-input"
            type="file"
            disabled
            class="hidden"
            accept=".db,.mbtiles,.sqlite,.sqlite3,.smp"
          />

          <div class="mv-drop">
            <button id="open-button" class="mv-primary hidden" disabled>
              Open map file
            </button>
            <div id="spinner" class="mv-spinner" role="status" aria-label="Opening file">
              <svg class="mv-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                <path d="M21 12a9 9 0 1 1-6.219-8.56" />
              </svg>
            </div>
            <p id="drop-hint" class="mv-drop-hint hidden">or drag &amp; drop a file here</p>
            <p class="mv-drop-formats">.mbtiles &nbsp;·&nbsp; .smp</p>
          </div>

          <p id="open-error" role="alert" class="mv-error hidden"></p>
        </section>
      </main>

      <!-- PWA install guidance (shown via JS) -->
      <div id="install-guide" class="mv-install hidden">
        <button id="install-button" class="mv-install-btn hidden">
          Install app for offline use
        </button>
        <p id="install-ios" class="hidden">
          To install, tap
          <svg class="mv-inline-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8" />
            <polyline points="16 6 12 2 8 6" />
            <line x1="12" y1="2" x2="12" y2="15" />
          </svg>
          then <strong>Add to Home Screen</strong>
        </p>
      </div>
    </div>

    <div id="drop-overlay" class="drop-overlay hidden">
      <svg class="drop-overlay-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 16V4m0 0l-4 4m4-4l4 4M4 20h16" transform="rotate(180 12 12)" />
      </svg>
      <p class="drop-overlay-title">Drop file to open</p>
      <p class="drop-overlay-sub">.mbtiles &nbsp;·&nbsp; .smp</p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
